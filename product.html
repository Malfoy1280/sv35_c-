<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script>
      // window.alert("Hello JavaScript Learner");
      let confirmMessage = window.confirm("Are you sure?");
      if (confirmMessage) {
        document.writeln("You clicked on OK button");
      } else {
        document.writeln("You clicked on Cancel button");
      }
    </script>
  </head>
  <body></body>
</html>
